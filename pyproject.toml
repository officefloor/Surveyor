[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "surveyor"
version = "0.1.0"
description = "Language-agnostic change-impact + pain-signal harness over git history (offline, no AI)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["lizard>=1.17"]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]           # only needed for a --config file
stats = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]  # optional richer analyze pass

[project.scripts]
surveyor = "surveyor.__main__:main"

[tool.setuptools]
packages = ["surveyor", "surveyor.plugins"]
